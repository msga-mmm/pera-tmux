[package]
name = "pera-tmux"
version = "0.1.0"
edition = "2024"
description = "A Rust library for interacting with tmux sessions."
license = "MIT"

[lib]
name = "pera_tmux"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.44.0", features = ["macros", "process", "rt-multi-thread", "signal", "time"] }
